<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F242A">
<meta name="description" content="Apprendre la guitare avec des morceaux connus et des comptines.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trois Accords">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trois Accords</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — sticky header, single column of panels, amp-panel "stage" for play-along, fixed tab bar */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --ink:#1A1E23; --muted:#5B6570; --line:#D3D9DE;
  --brass:#B8730C; --brass-ink:#8F5806; --brass-soft:#F6E8CF; --on-brass:#FFFFFF;
  --stage:#1F242A; --stage-ink:#F3EFE7; --stage-muted:#A3ACB4; --stage-line:#39414A;
  --ok:#2E7A4C;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D20; --ink:#E7E9EB; --muted:#99A2AA; --line:#2B3034;
  --brass:#E2A23B; --brass-ink:#EDB55A; --brass-soft:#3A2C14; --on-brass:#1A1206;
  --stage:#0A0C0E; --stage-ink:#F3EFE7; --stage-muted:#8E979F; --stage-line:#262B30;
  --ok:#62C08A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --ink:#E7E9EB; --muted:#99A2AA; --line:#2B3034;
  --brass:#E2A23B; --brass-ink:#EDB55A; --brass-soft:#3A2C14; --on-brass:#1A1206;
  --stage:#0A0C0E; --stage-ink:#F3EFE7; --stage-muted:#8E979F; --stage-line:#262B30;
  --ok:#62C08A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:30px}
h3{font-size:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.logo{width:28px;height:28px}
.logo .lf{fill:var(--brass)} .logo .ls{stroke:var(--on-brass)}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill b{color:var(--brass-ink)}

main{padding-top:18px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

/* buttons & chips */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.big{font-size:18px;padding:13px 22px;border-radius:12px;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.btn.sm{padding:6px 10px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip:disabled{opacity:.4;cursor:not-allowed}
.cname{font-family:var(--f-display);font-weight:700;font-size:15px;padding:2px 8px;border-radius:6px;background:var(--brass-soft);color:var(--brass-ink)}
.stars{color:var(--brass);letter-spacing:2px;font-size:15px}
.stars .off{color:var(--line)}

/* chord diagram */
.dg{width:100%;height:auto;display:block}
.dg .nut{fill:var(--ink)} .dg .fr{stroke:var(--line);stroke-width:1.5} .dg .st{stroke:var(--ink)}
.dg .op{fill:none;stroke:var(--ink);stroke-width:1.4} .dg .mu{fill:var(--muted);font:600 11px var(--f-body);text-anchor:middle}
.dg .dot{fill:var(--brass)} .dg .fn{fill:var(--on-brass);font:700 9px var(--f-body);text-anchor:middle}
.dg.inv .nut{fill:var(--stage-ink)} .dg.inv .st{stroke:var(--stage-ink)} .dg.inv .fr{stroke:var(--stage-line)}
.dg.inv .op{stroke:var(--stage-ink)} .dg.inv .mu{fill:var(--stage-muted)}

/* parcours */
.hero{display:grid;gap:14px}
.hero h2{font-size:34px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.step .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;border:2px solid var(--line);color:var(--muted)}
.step.cur{border-color:var(--brass)}
.step.cur .n{border-color:var(--brass);color:var(--brass-ink)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step .body{min-width:0;display:flex;flex-direction:column;gap:8px}
.songlinks{display:flex;flex-wrap:wrap;gap:6px}
.songlink{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.session{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;width:100%}
.task .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.task.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.task .tt{min-width:0}
.task .tt b{display:block}
.task .tt span{font-size:13px;color:var(--muted)}
.task .dur{font-size:12px;color:var(--muted)}

/* song list */
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.scard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%}
.scard .t{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.scard .a{font-size:13px;color:var(--muted)}
.lvl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* song view */
.back{align-self:flex-start}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.meta span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.stage{background:var(--stage);color:var(--stage-ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.stage-top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--stage-muted);font-weight:600}
.stage-main{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:end}
.now{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.now .cn{font-family:var(--f-display);font-weight:700;font-size:76px;line-height:.9;color:var(--brass)}
.now .d{width:96px}
.nextc{border-left:1px solid var(--stage-line);padding-left:14px;display:flex;flex-direction:column;gap:4px;opacity:.9}
.nextc .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--stage-muted);font-weight:600}
.nextc .cn{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.nextc .d{width:62px}
.count{position:absolute;inset:0;display:grid;place-items:center;background:var(--stage);font-family:var(--f-display);font-size:120px;font-weight:700;color:var(--brass)}
.strum{display:grid;gap:4px}
.sl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:8px;border:1px solid var(--stage-line)}
.sl .ar{font-size:22px;line-height:1;font-weight:700;height:24px}
.sl .ct{font-family:var(--f-mono);font-size:11px;color:var(--stage-muted)}
.sl.on{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.sl.on .ct{color:var(--on-brass)}
.controls{display:flex;flex-direction:column;gap:12px}
.tempo{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--brass)}
.sec{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sechead b{font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bar{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.bar .c{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar .sl2{font-size:11px;color:var(--muted);letter-spacing:2px}
.bar.on{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.bar.on .sl2{color:var(--on-brass)}
.minis{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mini{flex:0 0 auto;width:78px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 6px}
.mini b{font-family:var(--f-display);font-size:19px}

/* chords */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.ccard .hd{display:flex;justify-content:space-between;align-items:baseline}
.ccard .hd b{font-family:var(--f-display);font-size:30px;line-height:1}
.ccard .d{width:110px;align-self:center}
.ccard p{margin:0;font-size:13px;color:var(--muted)}
.learn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}

/* exercises */
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;max-width:360px;margin:0 auto;width:100%}
.pair .side{display:flex;flex-direction:column;align-items:center;gap:4px}
.pair .side b{font-family:var(--f-display);font-size:34px;line-height:1}
.pair .d{width:100px}
.pair .sw{font-size:22px;color:var(--muted)}
.timer{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper .v{font-family:var(--f-display);font-size:48px;font-weight:700;min-width:80px;text-align:center}
.stepper button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:24px;font-weight:600}
.hist{display:flex;gap:4px;align-items:flex-end;height:46px}
.hist i{flex:1;background:var(--brass);border-radius:3px 3px 0 0;min-height:3px;max-width:26px}
.strings{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.strings button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.strings b{font-family:var(--f-display);font-size:26px;line-height:1}
.strings span{font-size:11px;color:var(--muted)}
.strings button.on{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.strings button.on span{color:var(--on-brass)}
.patrow{display:grid;gap:4px}
.patrow .sl{border-color:var(--line);background:var(--bg)}
.patrow .sl .ct{color:var(--muted)}
.patrow .sl.on{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.patrow .sl.on .ct{color:var(--on-brass)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.lyr{grid-column:1/-1;font-style:italic;color:var(--muted);font-size:14px;padding-top:4px;text-wrap:balance}
.stage .ly{font-size:18px;line-height:1.35;color:var(--stage-ink);min-height:1.4em;font-style:italic;text-wrap:balance}
.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--brass-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:11;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.note{font-size:13px;color:var(--muted);margin:0}
@media (max-width:480px){
  .now .cn{font-size:62px} .now .d{width:82px}
  .stage-main{grid-template-columns:1fr auto}
  .nextc .d{display:none}
  h2{font-size:26px} .hero h2{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{--bad:#B3261E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bad:#F2867D}}
:root[data-theme="dark"]{--bad:#F2867D}
.dg .st.hl{stroke:var(--brass);stroke-width:3.4}
.dg .nt{fill:var(--ink)}
.why{border-left:3px solid var(--brass);padding:4px 0 4px 12px;max-width:62ch}
.why p{margin:4px 0 0}
.tierhead{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.tierhead b{font-family:var(--f-display);font-size:20px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tier{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.tier .tr{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tier .tr i{display:block;height:100%;background:var(--brass)}
.badge-mem{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--brass-soft);color:var(--brass-ink);white-space:nowrap}
.memon .bar .c,.memon #nowName,.memon #nextName,.memon #nowDg,.memon #nextDg,.memon .hide-mem{visibility:hidden}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.form textarea{font-family:var(--f-mono);font-size:14px;resize:vertical}
.err{color:var(--bad);font-size:13px;margin:0}
details.dx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
details.dx summary{font-weight:600;cursor:pointer}
details.dx p{margin:6px 0 0;font-size:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;min-width:420px;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl td.k{font-weight:700;color:var(--brass-ink)}
.tbl td:first-child{font-weight:700;text-align:left}
.tbl button{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.chip.good{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chip.badc{border-color:var(--bad);color:var(--bad)}
.chip.earopt:disabled{opacity:1;cursor:default}
.sc{max-width:440px}
@media (max-width:480px){.form{grid-template-columns:1fr}.tiers{gap:6px}
  .brand{gap:7px;min-width:0}.brand b{font-size:16px;white-space:nowrap;letter-spacing:0}.logo{width:22px;height:22px}.top .wrap{gap:8px}#sndTest{white-space:nowrap}
  .top .wrap>.row{flex-wrap:nowrap}.stats{flex-wrap:nowrap}.stats .pill:nth-child(2){display:none}.pill{padding:4px 7px}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect class="lf" x="1" y="1" width="26" height="26" rx="7"/><path class="ls" d="M9 7v14M14 7v14M19 7v14" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    <b>Trois Accords</b>
  </div>
  <div class="row" style="gap:6px"><div class="stats" id="stats"></div><button class="pill" id="sndTest" aria-label="Tester le son" style="cursor:pointer">🔊 Son</button></div>
</div></header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Navigation"><div class="in" id="tabs">
  <button data-tab="parcours"><svg viewBox="0 0 24 24"><path d="M4 19c4 0 3-7 8-7s4-7 8-7"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg>Parcours</button>
  <button data-tab="morceaux"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>Morceaux</button>
  <button data-tab="comptines"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Comptines</button>
  <button data-tab="accords"><svg viewBox="0 0 24 24"><path d="M6 3v18M10 3v18M14 3v18M18 3v18M4 7h16M4 11h16M4 15h16"/></svg>Accords</button>

function nm(s){const m=/^([A-G])(#|b)?(\d)$/.exec(s);if(!m)return null;return 12*(+m[3]+1)+PCN[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0);}
function parseMel(str){const tk=str.trim().split(/\s+/),out=[];let o=0;for(let i=0;i<tk.length;i+=2){const d=parseFloat(tk[i+1]);out.push({m:tk[i]==="r"?null:nm(tk[i]),o,d});o+=d;}return out;}
function lines(sec){return (sec.l||[]).map((x,i)=>Array.isArray(x)?{s:x[0],t:x[1]}:{s:i*4,t:x});}
function lineAt(sec,k){let t="";lines(sec).forEach(l=>{if(l.s<=k)t=l.t;});return t;}

const KEY="trois-accords-v1";

function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
function markDay(){const t=today();if(!P.days.includes(t)){P.days.push(t);P.days=P.days.slice(-90);}save();}
function streak(){const d=new Date();if(!P.days.includes(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(P.days.includes(ymd(d))){n++;d.setDate(d.getDate()-1);}return n;}
function doneToday(k){const t=today();P.done[t]=P.done[t]||[];if(!P.done[t].includes(k))P.done[t].push(k);for(const x in P.done)if(x!==t)delete P.done[x];save();}
const isDone=k=>(P.done[today()]||[]).includes(k);
const starsOf=id=>(P.songs[id]&&P.songs[id].stars)||0;
function addTime(sec){if(sec>2){P.secs+=sec;markDay();}}
function totalStars(){return SONGS.reduce((a,s)=>a+starsOf(s.id),0);}
function stepDone(st){return st.chords.every(c=>P.chords[c])&&st.songs.every(id=>starsOf(id)>0);}
function curStep(){const i=STEPS.findIndex(s=>!stepDone(s));return i<0?STEPS.length-1:i;}

function pluckBuf(freq){const k=Math.round(freq*4);if(bufCache[k])return bufCache[k];const sr=ctx.sampleRate,N=Math.floor(sr*2.6),p=Math.max(2,Math.round(sr/freq));const b=ctx.createBuffer(1,N,sr),d=b.getChannelData(0);let prev=0;for(let i=0;i<p;i++){prev=(Math.random()*2-1)*.6+prev*.4;d[i]=prev;}for(let i=p;i<N;i++)d[i]=.4986*(d[i-p]+d[i-p+1]);return bufCache[k]=b;}
function note(stringIdx,fret,t,vel,dest){const f=OPEN[stringIdx]*Math.pow(2,fret/12);const src=ctx.createBufferSource();src.buffer=pluckBuf(f);const g=ctx.createGain();g.gain.value=vel;src.connect(g);g.connect(dest||master);const prev=ringing[stringIdx];if(prev){try{prev.g.gain.setTargetAtTime(0,t,.02);prev.src.stop(t+.25);}catch(e){}}src.start(t);ringing[stringIdx]={src,g};}
function strum(name,t,dir,vel,capo,dest){const c=CHORDS[name];if(!c)return;ac();if(t==null){if(ctx.state!=="running"){ctx.resume().then(()=>strum(name,null,dir,vel,capo,dest)).catch(()=>{});return;}t=ctx.currentTime+.03;}dir=dir||"D";vel=vel||1;capo=capo||0;let s=[0,1,2,3,4,5].filter(i=>c.f[i]>=0);if(dir==="U")s=s.reverse().slice(0,4);s.forEach((i,k)=>note(i,c.f[i]+capo,t+k*(dir==="U"?.009:.014),vel*(dir==="U"?.15:.21),dest));}
function click(t,acc,dest){const o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=acc?1600:1050;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(acc?.16:.09,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+.06);}
function hush(){if(!ctx)return;const now=ctx.currentTime;LIVE.forEach(o=>{try{o.g.gain.cancelScheduledValues(now);o.g.gain.setTargetAtTime(0,now,.03);}catch(e){}});LIVE.clear();ringing.forEach(x=>{if(x)try{x.g.gain.setTargetAtTime(0,ctx.currentTime,.05);}catch(e){}});}

/* ---------- band: voice, bass, drums, piano ---------- */
const BUSLVL={guitar:1,voice:1.5,bass:1,drums:.75,keys:1,click:1};let BUS=null;
const MIXDEF={voice:true,guitar:true,bass:true,drums:true,keys:false,click:false};
const LAYERS=[["voice","Voix"],["guitar","Guitare"],["bass","Basse"],["drums","Batterie"],["keys","Piano"],["click","Métronome"]];
function setBus(k,on){if(!BUS||!BUS[k])return;BUS[k].gain.setTargetAtTime(on?BUSLVL[k]:0,ctx.currentTime,.015);}
function applyMix(m){for(const k in BUSLVL)setBus(k,!!m[k]);}
const LIVE=new Set();function track(g,end){LIVE.add({g,end});}
function prune(){const n=ctx.currentTime;LIVE.forEach(o=>{if(o.end<n)LIVE.delete(o);});}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const OPEN_M=[40,45,50,55,59,64];
function rootPc(name){const m=/^([A-G])(#|b)?/.exec(name);return (PCN[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0)+12)%12;}
function sing(midi,t,d,dest){const f=mtof(midi);
  const o=ctx.createOscillator(),o2=ctx.createOscillator();o.type="sawtooth";o2.type="sawtooth";o.frequency.value=f;o2.frequency.value=f*1.004;
  const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.012,t+Math.min(.4,d*.6));lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  const pre=ctx.createGain();pre.gain.value=.5;o.connect(pre);o2.connect(pre);
  const env=ctx.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(.32,t+.04);env.gain.setValueAtTime(.32,t+Math.max(.05,d-.08));env.gain.linearRampToValueAtTime(0,t+d);
  [[730,7,1],[1090,9,.55],[2440,12,.3]].forEach(([fr,q,a])=>{const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=fr;bp.Q.value=q;const ga=ctx.createGain();ga.gain.value=a*2.4;pre.connect(bp);bp.connect(ga);ga.connect(env);});
  env.connect(dest);[o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+d+.05);});track(env,t+d+.05);}
function bassNote(midi,t,d,dest){const f=mtof(midi);const o=ctx.createOscillator(),s=ctx.createOscillator();o.type="sawtooth";s.type="sine";o.frequency.value=f;s.frequency.value=f;
  const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(1400,t);lp.frequency.exponentialRampToValueAtTime(380,t+.25);
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.12,t+Math.max(.05,d*.7));g.gain.linearRampToValueAtTime(0,t+d);
  const sg=ctx.createGain();sg.gain.value=.7;o.connect(lp);lp.connect(g);s.connect(sg);sg.connect(g);g.connect(dest);o.start(t);s.start(t);o.stop(t+d+.02);s.stop(t+d+.02);track(g,t+d+.02);}
function piano(name,t,d,capo,dest){const c=CHORDS[name];if(!c)return;const pcs=[...new Set(c.f.map((f,i)=>f<0?-1:(OPEN_M[i]+f+capo)%12).filter(x=>x>=0))];
  const g=ctx.createGain();g.connect(dest);const end=t+Math.max(.6,d+.25);
  pcs.forEach((pc,k)=>{const m=55+((pc-7+12)%12),tt=t+k*.004;const o=ctx.createOscillator(),o2=ctx.createOscillator(),e=ctx.createGain(),e2=ctx.createGain();o.type="triangle";o2.type="sine";o.frequency.value=mtof(m);o2.frequency.value=mtof(m)*2;e2.gain.value=.3;
    o.connect(e);o2.connect(e2);e2.connect(e);e.gain.setValueAtTime(0,tt);e.gain.linearRampToValueAtTime(.11,tt+.006);e.gain.exponentialRampToValueAtTime(.035,tt+.5);e.gain.exponentialRampToValueAtTime(.001,end);e.connect(g);o.start(tt);o2.start(tt);o.stop(end+.05);o2.stop(end+.05);});
  track(g,end+.05);}
let noiseBuf=null;function noise(){if(!noiseBuf){const n=ctx.sampleRate;noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}return noiseBuf;}
function kick(t,dest){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.34);}
function snare(t,dest,v){const s=ctx.createBufferSource();s.buffer=noise();const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=1400;const g=ctx.createGain();g.gain.setValueAtTime(.45*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);s.connect(hp);hp.connect(g);g.connect(dest);s.start(t);s.stop(t+.2);
  const o=ctx.createOscillator(),og=ctx.createGain();o.type="triangle";o.frequency.value=185;og.gain.setValueAtTime(.3*v,t);og.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(og);og.connect(dest);o.start(t);o.stop(t+.1);}
function hat(t,dest,v){const s=ctx.createBufferSource();s.buffer=noise();const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=7500;const g=ctx.createGain();g.gain.setValueAtTime(.16*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.045);s.connect(hp);hp.connect(g);g.connect(dest);s.start(t);s.stop(t+.06);}
function drumAt(r,s,t){const d=BUS.drums;
  if(r.beats===6){if(s===0)kick(t,d);if(s===3)snare(t,d,.8);hat(t,d,s%3===0?1:.6);}
  else if(r.beats===3){if(s===0)kick(t,d);else if(s%2===0)snare(t,d,.3);if(s%2===0)hat(t,d,1);}
  else{if(s===0||s===4)kick(t,d);if(s===2||s===6)snare(t,d,1);hat(t,d,s%2===0?1:.6);}}
function bassMidi(name){return 40+((rootPc(name)-4+12)%12);}
function bassAt(r,bar,s,t,dur){const sl=r.slots,half=sl/2,split=bar.ch.length>1;let n=null,len=half;
  if(s===0){n=bassMidi(bar.ch[0]);len=split||r.beats!==3?half:sl;}
  else if(s===half){if(split)n=bassMidi(bar.ch[1]);else if(r.beats!==3)n=bassMidi(bar.ch[0])+7;}
  if(n==null)return;n+=r.capo||0;while(n>52)n-=12;bassNote(n,t,len*dur*.92,BUS.bass);}

/* ---------- play-along engine ---------- */
const Eng={timer:null,run:null};
function engStart(o){ac();if(ctx.state!=="running"){ctx.resume().then(()=>engStart(o)).catch(()=>{});return;}engStop(true);applyMix(o.mix());const r=Object.assign({bar:o.countIn?-1:(o.startBar||0),slot:0,next:ctx.currentTime+.15,q:[],live:true,t0:performance.now()},o);r.slots=r.pattern.length;r.spb=r.beats===6?3:2;Eng.run=r;Eng.timer=setInterval(tick,25);tick();requestAnimationFrame(draw);}
function tick(){const r=Eng.run;if(!r)return;prune();while(r.next<ctx.currentTime+.12){const dur=60/r.bpm()/r.spb,t=r.next,b=r.bar,s=r.slot;const beat=s%r.spb===0,acc=s===0;
  if(b<0){if(beat)click(t,acc);}
  else{const bar=r.bars[b],half=r.slots/2,split=bar.ch.length>1;const ch=split&&s>=half?bar.ch[1]:bar.ch[0];const m=r.mix();
    if(m.click&&beat)click(t,acc,BUS.click);
    const p=r.pattern[s];if(m.guitar&&p)strum(ch,t,p,acc?1:.85,r.capo,BUS.guitar);
    if(m.keys&&(s===0||(split&&s===half)))piano(ch,t,(split?half:r.slots)*dur,r.capo||0,BUS.keys);
    if(m.bass)bassAt(r,bar,s,t,dur);
    if(m.drums)drumAt(r,s,t);
    if(m.voice&&s===0&&bar.mel){const bd=dur*r.spb;bar.mel.forEach(n=>{if(n.m!=null)sing(n.m,t+n.o*bd,n.d*bd*.97,BUS.voice);});}}
  r.q.push({t,b,s});r.slot++;r.next+=dur;
  if(r.slot>=r.slots){r.slot=0;if(r.bar<0)r.bar=r.startBar||0;else{r.bar++;const L=r.loop&&r.loop();if(L&&(r.bar>L[1]||r.bar<L[0]))r.bar=L[0];else if(r.bar>=r.bars.length){r.q.push({t:r.next,end:true});clearInterval(Eng.timer);Eng.timer=null;return;}}}}}
function draw(){const r=Eng.run;if(!r||!r.live)return;const now=ctx.currentTime;let last=null;while(r.q.length&&r.q[0].t<=now){const e=r.q.shift();if(e.end){r.live=false;Eng.run=null;addTime((performance.now()-r.t0)/1000);r.onEnd&&r.onEnd();return;}last=e;}if(last)r.onStep(last.b,last.s);requestAnimationFrame(draw);}
function engStop(silent){if(Eng.timer)clearInterval(Eng.timer);Eng.timer=null;const r=Eng.run;Eng.run=null;if(r){r.live=false;addTime((performance.now()-r.t0)/1000);if(!silent&&r.onStop)r.onStop((performance.now()-r.t0)/1000);}hush();}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function diagram(name,cls){const c=CHORDS[name];if(!c)return"";let s='<svg class="dg '+(cls||"")+'" viewBox="0 0 100 108" role="img" aria-label="Diagramme '+esc(name)+'"><rect class="nut" x="13" y="19" width="74" height="4" rx="1"/>';
  for(let j=1;j<=4;j++)s+='<line class="fr" x1="15" x2="85" y1="'+(21+j*20)+'" y2="'+(21+j*20)+'"/>';
  for(let i=0;i<6;i++){const x=15+i*14;s+='<line class="st" x1="'+x+'" x2="'+x+'" y1="21" y2="101" stroke-width="'+(1.9-i*.2).toFixed(2)+'"/>';const f=c.f[i];
   if(f<0)s+='<text class="mu" x="'+x+'" y="14">×</text>';else if(f===0)s+='<circle class="op" cx="'+x+'" cy="10" r="3.6"/>';else{const y=21+(f-.5)*20;s+='<circle class="dot" cx="'+x+'" cy="'+y+'" r="6.3"/><text class="fn" x="'+x+'" y="'+(y+3.2)+'">'+c.n[i]+'</text>';}}
  return s+"</svg>";}
const starsHTML=n=>'<span class="stars" aria-label="'+n+' étoile(s) sur 3">'+[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")+"</span>";
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}
function fmtMin(sec){const m=Math.round(sec/60);return m<60?m+" min":Math.floor(m/60)+" h "+String(m%60).padStart(2,"0");}
function countLabels(n,beats){if(beats===3)return["1","&","2","&","3","&"];return n===6?["1","2","3","4","5","6"]:["1","&","2","&","3","&","4","&"];}
const arrow=p=>p==="D"?"↓":p==="U"?"↑":p==="B"?"P":(p||"");

function go(tab,extra){engStop();xStop();view=Object.assign({tab},extra||{});render();window.scrollTo(0,0);}

  $$("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===view.tab?"page":"false"));

function renderParcours(){
  const ci=curStep(),st=STEPS[ci];
  const nextSong=st.songs.find(id=>starsOf(id)<3)||st.songs[0];
  const pair=st.pairs[0];
  const tasks=[
    ["tune","Accorder la guitare","Corde par corde, avec les notes de référence","1 min",'data-act="goex" data-v="tuner"'],
    ["change","Changements en 1 minute : "+pair[0]+" ↔ "+pair[1],"Compte combien de fois tu passes d'un accord à l'autre","2 min",'data-act="goex" data-v="change" data-p="'+ci+'"'],
    ["rhythm","Rythme "+PATS[st.pat].n.toLowerCase(),"Sur "+pair[0]+" et "+pair[1]+", au métronome","3 min",'data-act="goex" data-v="rhythm" data-p="'+ci+'"'],
    ["song","Jouer : "+byId[nextSong].t,byId[nextSong].a,"10 min",'data-act="song" data-v="'+nextSong+'"']
  ];
  main.innerHTML=`
  <section class="hero">
    <div class="eyebrow">Étape ${ci+1} sur ${STEPS.length}</div>
    <h2>${esc(st.t)}</h2>
    <p class="muted" style="margin:0;max-width:60ch">${esc(st.d)}</p>
  </section>
  <section class="panel stack">
    <div class="row between"><h3>Séance du jour</h3><span class="muted" style="font-size:13px">15 min, dans l'ordre</span></div>
    <div class="session">${tasks.map(t=>`<button class="task${isDone(t[0])?" ok":""}" ${t[4]}><span class="ck">${isDone(t[0])?"✓":""}</span><span class="tt"><b>${esc(t[1])}</b><span>${esc(t[2])}</span></span><span class="dur">${t[3]}</span></button>`).join("")}</div>
    <p class="note">Une séance courte chaque jour fait plus progresser qu'une longue le week-end.</p>
  </section>
  <section class="stack">
    <h3>Le parcours</h3>
    <div class="steps">${STEPS.map((s,i)=>{const done=stepDone(s);return `
      <div class="step${done?" done":""}${i===ci&&!done?" cur":""}">
        <div class="n">${done?"✓":i+1}</div>
        <div class="body">
          <b style="font-size:16px">${esc(s.t)}</b>
          ${s.chords.length?`<div class="chips">${s.chords.map(c=>`<button class="chip" data-act="hear" data-v="${c}" aria-label="Écouter ${c}" style="${P.chords[c]?"border-color:var(--ok)":""}">${c}${P.chords[c]?" ✓":""}</button>`).join("")}</div>`:`<span class="muted" style="font-size:13px">Aucun nouvel accord</span>`}

        </div>

  </section>`;
}

let filt="all",q="";

  const mine=SONGS.filter(s=>!s.cat&&s.ch.every(c=>P.chords[c])).length;
  main.innerHTML=`
  <section class="stack">
    <h2>Morceaux</h2>
    <input class="search" id="q" type="search" placeholder="Chercher un titre, un artiste, un accord" value="${esc(q)}" autocomplete="off">
    <div class="chips">${[["all","Tous"],["1","Niveau 1"],["2","Niveau 2"],["3","Niveau 3"],["mine","Jouables avec mes accords ("+mine+")"]].map(f=>`<button class="chip" data-act="filt" data-v="${f[0]}" aria-pressed="${filt===f[0]}">${f[1]}</button>`).join("")}</div>
  </section>
  <section class="songs" id="songlist"></section>`;
  paintList();

}
function paintList(){
  const k=q.trim().toLowerCase();
  const list=SONGS.filter(s=>!s.cat&&(filt==="all"||(filt==="mine"?s.ch.every(c=>P.chords[c]):String(s.lvl)===filt))&&(!k||(s.t+" "+s.a+" "+s.ch.join(" ")).toLowerCase().includes(k)));
  $("#songlist").innerHTML=list.length?list.map(s=>`
    <button class="scard" data-act="song" data-v="${s.id}">
      <div class="row between" style="width:100%"><span class="lvl">Niveau ${s.lvl}${s.capo?" · capo "+s.capo:""}</span>${starsHTML(starsOf(s.id))}</div>
      <div><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)}</div></div>

    </button>`).join(""):`<p class="muted">Aucun morceau ne correspond. ${filt==="mine"?"Marque tes accords comme maîtrisés dans l'onglet Accords.":""}</p>`;
}

let S=null;
function renderSong(){
  const song=byId[view.song];const bars=[],secs=[];
  song.sec.forEach((sec,si)=>{const st=bars.length;for(let r=0;r<(sec.x||1);r++)sec.b.forEach((b,k)=>bars.push({ch:b.split(" "),sec:si,ly:lineAt(sec,k),mel:sec.m?parseMel(sec.m[k]):null}));secs.push([st,bars.length-1]);});
  S={song,bars,secs,rate:song.bpm>=110?.6:.75,mix:Object.assign({},MIXDEF,P.mix||{}),loop:null,startBar:0,curBar:-2,curCh:null,nextCh:null,minRate:1};

/* --- diagrammes (barré, case de départ, gaucher) --- */
function diagram(name,cls){const c=CHORDS[name];if(!c)return"";
  const pos=c.f.filter(f=>f>0),mx=pos.length?Math.max(...pos):0,base=mx>4?Math.min(...pos):1;
  const X=i=>P.lefty?15+(5-i)*14:15+i*14,Y=f=>21+(f-base+.5)*20;
  let s='<svg class="dg '+(cls||"")+'" viewBox="0 0 100 108" role="img" aria-label="Diagramme '+esc(name)+'">';
  s+=base===1?'<rect class="nut" x="13" y="19" width="74" height="4" rx="1"/>':'<line class="fr" x1="15" x2="85" y1="21" y2="21"/><text class="mu" x="'+(P.lefty?95:5)+'" y="'+(Y(base)+4)+'">'+base+'</text>';
  for(let j=1;j<=4;j++)s+='<line class="fr" x1="15" x2="85" y1="'+(21+j*20)+'" y2="'+(21+j*20)+'"/>';
  for(let i=0;i<6;i++){const x=X(i);s+='<line class="st" data-s="'+i+'" x1="'+x+'" x2="'+x+'" y1="21" y2="101" stroke-width="'+(1.9-i*.2).toFixed(2)+'"/>';}
  if(c.b){const bf=c.b[0],x1=Math.min(X(c.b[1]),X(c.b[2])),x2=Math.max(X(c.b[1]),X(c.b[2]));s+='<rect class="dot" x="'+(x1-6)+'" y="'+(Y(bf)-6)+'" width="'+(x2-x1+12)+'" height="12" rx="6"/><text class="fn" x="'+((x1+x2)/2)+'" y="'+(Y(bf)+3.2)+'">1</text>';}
  for(let i=0;i<6;i++){const x=X(i),f=c.f[i];
   if(f<0)s+='<text class="mu" x="'+x+'" y="14">×</text>';else if(f===0)s+='<circle class="op" cx="'+x+'" cy="10" r="3.6"/>';
   else if(!(c.b&&f===c.b[0]&&c.n[i]===1)){const y=Y(f);s+='<circle class="dot" cx="'+x+'" cy="'+y+'" r="6.3"/><text class="fn" x="'+x+'" y="'+(y+3.2)+'">'+c.n[i]+'</text>';}}
  return s+"</svg>";}
function scaleSVG(k){const sc=SCALES[k],W=300,X=f=>{const x=30+(f-5+.5)*60;return P.lefty?W-x:x;},Y=i=>15+(5-i)*20;
  let s='<svg class="dg sc" viewBox="0 0 300 140" role="img" aria-label="'+esc(sc.n)+'">';
  for(let k2=0;k2<=4;k2++){const x=30+k2*60;s+='<line class="fr" x1="'+x+'" x2="'+x+'" y1="15" y2="115"/>';}
  for(let i=0;i<6;i++)s+='<line class="st" x1="30" x2="270" y1="'+Y(i)+'" y2="'+Y(i)+'" stroke-width="'+(1.9-i*.2).toFixed(2)+'"/>';
  [5,6,7,8].forEach(f=>{s+='<text class="mu" x="'+X(f)+'" y="134">'+f+'</text>';});
  sc.notes.forEach(([i,f,r])=>{s+='<circle class="'+(r?"dot":"nt")+'" cx="'+X(f)+'" cy="'+Y(i)+'" r="7.5"/>';});
  return s+"</svg>";}
function scalePanel(k){return `<section class="panel stack"><div><div class="eyebrow">Pour improviser</div><h3>${SCALES[k].n}</h3></div>${scaleSVG(k)}<p class="note">Cases 5 à 8, la corde aiguë en haut comme sur une tablature. Les ronds dorés sont des La : commence et termine tes phrases dessus. Coupe la guitare et joue ces notes sur la basse et la batterie.</p><div class="row"><button class="btn" data-act="scale" data-v="${k}">▶ Écouter la gamme</button></div></section>`;}
function countLabels(n,beats){if(beats===6)return Array.from({length:n},(_,i)=>String(i+1));const bpb=beats||4,spb=n/bpb;return Array.from({length:n},(_,i)=>i%spb===0?String(i/spb+1):(spb===2?"&":"·"));}

/* --- moteur : arpèges, shuffle, pauses, accélération --- */
function pluckP(name,p,t,capo,dest,acc){const c=CHORDS[name];if(!c)return;const i=p==="B"?c.f.findIndex(f=>f>=0):6-(+p);if(i<0||i>5||c.f[i]<0)return;note(i,c.f[i]+(capo||0),t,acc?.36:.3,dest);}
function drumAt(r,s,t){const d=BUS.drums,spb=r.spb;
  if(r.beats===6){if(s===0)kick(t,d);if(s===spb)snare(t,d,.8);hat(t,d,s%spb===0?1:.6);return;}
  const on=s%spb===0,bi=s/spb;
  if(r.beats===3){if(s===0)kick(t,d);else if(on)snare(t,d,.3);if(on)hat(t,d,1);return;}
  if(on&&(bi===0||bi===2))kick(t,d);if(on&&(bi===1||bi===3))snare(t,d,1);
  if(spb===3){if(s%3!==1)hat(t,d,s%3===0?1:.55);}else hat(t,d,on?1:.6);}
function engStart(o){ac();if(ctx.state!=="running"){ctx.resume().then(()=>engStart(o)).catch(()=>{});return;}engStop(true);applyMix(o.mix());
  const r=Object.assign({bar:o.countIn?-1:(o.startBar||0),slot:0,next:ctx.currentTime+.15,q:[],live:true,t0:performance.now(),gap:false},o);
  r.slots=r.pattern.length;r.spb=r.slots/bpbOf(r.beats);Eng.run=r;Eng.timer=setInterval(tick,25);tick();requestAnimationFrame(draw);}
function tick(){const r=Eng.run;if(!r)return;prune();
  while(r.next<ctx.currentTime+.12){const dur=60/r.bpm()/r.spb,t=r.next,b=r.bar,s=r.slot;const beat=s%r.spb===0,acc=s===0;
    if(b<0||r.gap){if(beat)click(t,acc);}
    else{const bar=r.bars[b],half=r.slots/2,split=bar.ch.length>1;const ch=split&&s>=half?bar.ch[1]:bar.ch[0];const m=r.mix();
      if(m.click&&beat)click(t,acc,BUS.click);
      const p=r.pattern[s];if(m.guitar&&p){if(p==="D"||p==="U")strum(ch,t,p,acc?1:.85,r.capo,BUS.guitar);else pluckP(ch,p,t,r.capo,BUS.guitar,acc);}
      if(m.keys&&(s===0||(split&&s===half)))piano(ch,t,(split?half:r.slots)*dur,r.capo||0,BUS.keys);
      if(m.bass)bassAt(r,bar,s,t,dur);
      if(m.drums)drumAt(r,s,t);
      if(m.voice&&s===0&&bar.mel){const bd=dur*r.spb;bar.mel.forEach(n=>{if(n.m!=null)sing(n.m,t+n.o*bd,n.d*bd*.97,BUS.voice);});}}
    r.q.push({t,b,s,gap:r.gap});r.slot++;r.next+=dur;
    if(r.slot>=r.slots){r.slot=0;
      if(r.bar<0)r.bar=r.startBar||0;
      else if(r.gap)r.gap=false;
      else{let nb=r.bar+1;const L=r.loop&&r.loop();
        if(L&&(nb>L[1]||nb<L[0])){nb=L[0];if(r.onWrap)r.onWrap();}
        else if(nb>=r.bars.length){r.q.push({t:r.next,end:true});clearInterval(Eng.timer);Eng.timer=null;return;}
        if(r.gaps&&r.gaps()){const a=r.bars[r.bar].ch,c=r.bars[nb].ch;if(a[a.length-1]!==c[0])r.gap=true;}
        r.bar=nb;}}}}
function draw(){const r=Eng.run;if(!r||!r.live)return;const now=ctx.currentTime;let last=null;while(r.q.length&&r.q[0].t<=now){const e=r.q.shift();if(e.end){r.live=false;Eng.run=null;addTime((performance.now()-r.t0)/1000);if(r.onEnd)r.onEnd();return;}last=e;}if(last)r.onStep(last.b,last.s,last.gap);requestAnimationFrame(draw);}
function go(tab,extra){engStop();xStop();main.classList.remove("memon");view=Object.assign({tab},extra||{});render();window.scrollTo(0,0);}

const FRN={do:"C","ré":"D",re:"D",mi:"E",fa:"F",sol:"G",la:"A",si:"B"};

  t=t.replace(/^[a-g]/,c=>c.toUpperCase()).replace(/min$/,"m");if(CHORDS[t])return t;return Object.keys(CHORDS).find(x=>x.toLowerCase()===t.toLowerCase())||null;}
function parseGrid(txt){const secs=[],bad=new Set(),errs=[];
  txt.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach((line,li)=>{let name="Partie "+(li+1),rest=line;const m=/^([^:|]{1,30}):(.*)$/.exec(line);if(m){name=m[1].trim();rest=m[2];}
    let x=1;const xm=/\s[x×](\d{1,2})\s*$/i.exec(" "+rest);if(xm){x=Math.max(1,Math.min(16,+xm[1]));rest=rest.replace(/[x×]\d{1,2}\s*$/i,"");}
    const parts=rest.includes("|")?rest.split("|"):rest.trim().split(/\s+/);const b=[];
    parts.map(p=>p.trim()).filter(Boolean).forEach(bt=>{const toks=bt.split(/\s+/);if(toks.length>2)errs.push("« "+bt+" » : deux accords au maximum par mesure.");b.push(toks.slice(0,2).map(tk=>{const c=normChord(tk);if(!c)bad.add(tk);return c||tk;}).join(" "));});
    if(b.length)secs.push({n:name,b,x});});
  if(bad.size)errs.unshift((bad.size>1?"Accords inconnus : ":"Accord inconnu : ")+[...bad].join(", ")+". Accords disponibles : "+Object.keys(CHORDS).join(", ")+".");
  if(!secs.length)errs.push("Écris au moins une mesure, par exemple : G | D | Em | C");
  return {secs,errs};}

function tabNote(n,t,d,prev){const idx=6-n[0],tech=n[3];let from=n[1];if((tech==="/"||tech==="\\")&&prev)from=prev[1];
  const src=ctx.createBufferSource();src.buffer=pluckBuf(OPEN[idx]*Math.pow(2,from/12));const g=ctx.createGain();let vel=.45;
  if(tech==="h"||tech==="p")vel=.3;
  if(from!==n[1]){src.playbackRate.setValueAtTime(1,t);src.playbackRate.linearRampToValueAtTime(Math.pow(2,(n[1]-from)/12),t+Math.min(.12,d*.5));vel=.36;}
  if(tech==="b"){src.playbackRate.setValueAtTime(1,t+.04);src.playbackRate.linearRampToValueAtTime(Math.pow(2,2/12),t+Math.min(.28,d*.6));}
  let node=src;if(tech==="pm"){const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;src.connect(lp);node=lp;}
  node.connect(g);g.connect(master);g.gain.setValueAtTime(vel,t);const rel=tech==="pm"?t+.14:t+d+.25;g.gain.setTargetAtTime(0,rel,tech==="pm"?.03:.08);
  const pr=ringing[idx];if(pr){try{pr.g.gain.setTargetAtTime(0,t,.015);}catch(e){}}ringing[idx]={src,g};
  src.start(t);src.stop(rel+.6);track(g,rel+.6);}
function tabPlay(){if(TP){tabStop();return;}const L=TABBY[view.tabl];if(!L)return;ac();if(ctx.state!=="running"){ctx.resume().then(tabPlay).catch(()=>{});return;}
  const beat=60/(L.bpm*TS.rate),t0=ctx.currentTime+.15,start=t0+4*beat,timers=[],total=L.notes.reduce((a,n)=>a+n[2],0),mel=TS.mel,rate=TS.rate,prev={};let pos=0;
  for(let i=0;i<4;i++)tclick(t0+i*beat,i===0);for(let b=0;b<Math.ceil(total);b++)tclick(start+b*beat,b%4===0,.5);
  L.notes.forEach((n,i)=>{const t=start+pos*beat,d=n[2]*beat;if(n[0]){if(mel)tabNote(n,t,d,prev[n[0]]);prev[n[0]]=n;
    timers.push(setTimeout(()=>{$$(".tn.on").forEach(e=>e.classList.remove("on"));const g=$("#tn-"+i),w=$("#tabwrap");if(g){g.classList.add("on");if(w){const x=+g.querySelector("rect").getAttribute("x");w.scrollLeft=Math.max(0,x-w.clientWidth/2);}}},Math.max(0,(t-ctx.currentTime)*1000)));}
    pos+=n[2];});
  timers.push(setTimeout(()=>tabEnd(L,mel,rate),Math.max(0,(start+total*beat-ctx.currentTime)*1000+200)));
  TP={timers,t0:performance.now()};const b=$("#tabPlay");if(b)b.textContent="■ Stop";markDay();}
function tabStop(){if(!TP)return;TP.timers.forEach(clearTimeout);addTime((performance.now()-TP.t0)/1000);TP=null;hush();$$(".tn.on").forEach(e=>e.classList.remove("on"));const b=$("#tabPlay");if(b)b.textContent="▶ Jouer";}
function tabEnd(L,mel,rate){tabStop();if(!mel&&rate>=.75){P.tabs=P.tabs||{};const nw=!P.tabs[L.id];P.tabs[L.id]=true;save();doneToday("tab");toast(nw?"Leçon validée":"Bien joué, leçon déjà validée");render2Stats();const h=$("#tabStatus");if(h)h.hidden=false;}
  else toast(mel?"Maintenant coupe la mélodie et joue-la toi-même.":"Monte à 75 % pour valider la leçon.");}

/* --- C. progression honnête : test des accords, étoiles guitare coupée --- */
const MASTER=20;
function bestFor(c){let b=0;for(const k in P.changes){if(k.split("-").includes(c))P.changes[k].forEach(h=>{if(h.n>b)b=h.n;});}return b;}
function partnerFor(c){for(const s of STEPS)for(const p of s.pairs)if(p.includes(c))return p[0]===c?p[1]:p[0];const m=Object.keys(P.chords).find(x=>x!==c);return m||(c==="G"?"C":"G");}

/* --- D. révision espacée --- */
const IVL=[1,2,4,8,16,32];
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d);}
function srsDone(id,mem){const s=P.songs[id];s.box=Math.min(5,(s.box||0)+(mem?2:1));s.due=addDays(IVL[s.box]);s.last=today();}
function dueSongs(){const t=today();return SONGS.filter(s=>{const p=P.songs[s.id];return p&&p.stars>0&&p.due&&p.due<=t;}).sort((a,b)=>P.songs[a.id].due<P.songs[b.id].due?-1:1);}
for(const id in P.songs){const p=P.songs[id];if(p.stars>0&&!p.due)p.due=today();}

function songPlay(){
  if(Eng.run){engStop();return;}
  S.minRate=S.rate;S.memRun=S.mem;S.guitarRun=!S.mix.guitar;const full=S.loop===null&&S.startBar===0;
  engStart({bars:S.bars,beats:S.song.beats,bpm:()=>S.song.bpm*S.rate,pattern:PATS[S.song.pat].s,mix:()=>S.mix,capo:S.song.capo,
    loop:()=>S.loop===null?null:S.secs[S.loop],startBar:S.startBar,countIn:true,gaps:()=>S.gaps,onStep:songStep,
    onWrap:()=>{if(S.speed&&S.rate<1){S.rate=Math.min(1,Math.round((S.rate+.05)*100)/100);const el=$("#rate");if(el)el.value=S.rate*100;paintRate();toast("Tempo : "+Math.round(S.rate*100)+" %");}},
    onEnd:()=>songDone(full),onStop:sec=>songHalt(sec)});

}
function songDone(full){songHalt(999);if(!full){render2Stats();return;}
  const id=S.song.id;
  if(!S.guitarRun){toast("Morceau terminé. Coupe la guitare de l'appli pour gagner des étoiles : c'est toi qui dois jouer.");render2Stats();return;}
  const n=S.minRate>=1?3:S.minRate>=.75?2:1;P.songs[id]=P.songs[id]||{stars:0,runs:0};const ps=P.songs[id];ps.runs=(ps.runs||0)+1;const old=ps.stars;const wasDue=ps.due&&ps.due<=today();
  if(n>old)ps.stars=n;let memNew=false;const mem=S.memRun&&S.mem;if(mem&&!ps.mem){ps.mem=true;memNew=true;}
  srsDone(id,mem);save();doneToday("song");if(wasDue)doneToday("review");
  const nx=IVL[ps.box];
  toast(memNew?"Joué en entier de mémoire : badge Mémoire obtenu":n>old?"Morceau terminé à "+Math.round(S.minRate*100)+" % : "+"★".repeat(n)+" obtenu":"Bien joué. Prochaine révision dans "+nx+" jour"+(nx>1?"s":"")+".");
  const m=document.querySelector(".meta .stars");if(m)m.outerHTML=starsHTML(starsOf(id));render2Stats();}

/* --- E. sauvegarde en ligne --- */
const SYNC={state:"local",ref:null,busy:false,pending:false};let pushT=null;
function save(){P.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}cloudPush();}
function cloudPush(){if(!SYNC.ref)return;clearTimeout(pushT);pushT=setTimeout(doPush,1500);}
async function doPush(){if(!SYNC.ref)return;if(SYNC.busy){SYNC.pending=true;return;}SYNC.busy=true;try{await SYNC.ref.set(JSON.parse(JSON.stringify(P)));SYNC.state="cloud";}catch(e){SYNC.state="error";}SYNC.busy=false;paintSync();if(SYNC.pending){SYNC.pending=false;doPush();}}
function syncLabel(){return SYNC.state==="cloud"?"Progression sauvegardée en ligne, sur tous tes appareils.":SYNC.state==="error"?"Sauvegarde en ligne indisponible pour l'instant : progression gardée sur cet appareil.":"Progression gardée sur cet appareil.";}
function paintSync(){const el=$("#sync");if(el)el.textContent=syncLabel();}
function applyRemote(r){P=Object.assign({songs:{},chords:{},changes:{},days:[],secs:0,done:{}},r);try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}
  for(let i=SONGS.length-1;i>=0;i--)if(SONGS[i].cat==="perso"){delete byId[SONGS[i].id];SONGS.splice(i,1);}loadCustom();}
async function initCloud(){try{if(!window.claude)return;const db=await claude.use("db"),user=await claude.use("user");if(!db||!user)return;const id=await user.id();if(!id)return;
  const ref=db.doc("data/users/"+id+"/progress");const snap=await ref.get();SYNC.ref=ref;const r=snap.exists?snap.data():null;
  if(r&&(r.updatedAt||0)>(P.updatedAt||0)){applyRemote(JSON.parse(JSON.stringify(r)));SYNC.state="cloud";if(!Eng.run&&!TP)render();}
  else if(!r||(P.updatedAt||0)>(r.updatedAt||0)){await doPush();}
  else SYNC.state="cloud";
  paintSync();}catch(e){SYNC.state="local";paintSync();}}

function afterAccords(){
  $$(".learn").forEach(b=>{const c=b.dataset.v;if(P.chords[c])b.textContent="✓ Validé";else b.textContent=bestFor(c)>=MASTER?"Valider":"Valider par un test";});
  const top=main.querySelector("section .muted");if(top)top.insertAdjacentHTML("afterend",`<p class="note">Un accord se valide en réussissant ${MASTER} changements en une minute avec un autre accord. Le bouton t'emmène directement au test.</p>`);
  const dg=$("#diag");if(dg)dg.insertAdjacentHTML("afterend",coachHTML("Ex. : mon Fa barré frisé sur la 2e corde"));}
function render(){
  $$("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===view.tab?"page":"false"));
  render2Stats();
  if(view.song){renderSong();afterSong();return;}
  if(view.tab==="exercices"&&view.tabl){renderTabLesson();return;}
  ({parcours:renderParcours,morceaux:renderMorceaux,comptines:renderComptines,accords:renderAccords,exercices:renderExercices})[view.tab]();
  if(view.tab==="exercices")afterExercices();
  if(view.tab==="accords")afterAccords();
}
function go(tab,extra){engStop();xStop();tabStop();if(coachCtl)coachCtl.abort();main.classList.remove("memon");view=Object.assign({tab},extra||{});render();window.scrollTo(0,0);}

/* --- I. son : réverbération et corps de guitare --- */
function impulse(){const sr=ctx.sampleRate,n=Math.floor(sr*1.6),b=ctx.createBuffer(2,n,sr);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2);}return b;}
function ac(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=1.4;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    try{const rv=ctx.createConvolver();rv.buffer=impulse();const wet=ctx.createGain();wet.gain.value=.2;master.connect(rv);rv.connect(wet);wet.connect(comp);}catch(e){}
    BUS={};for(const k in BUSLVL){BUS[k]=ctx.createGain();BUS[k].gain.value=BUSLVL[k];
      if(k==="guitar"){const body=ctx.createBiquadFilter();body.type="peaking";body.frequency.value=120;body.gain.value=4;body.Q.value=1;const air=ctx.createBiquadFilter();air.type="highshelf";air.frequency.value=4000;air.gain.value=-3;BUS[k].connect(body);body.connect(air);air.connect(master);}
      else BUS[k].connect(master);}}
  if(ctx.state!=="running")ctx.resume().catch(()=>{});
  if(!unlocked){unlocked=true;try{const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);}catch(e){}
    try{silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute("playsinline","");silentEl.volume=0.01;const p=silentEl.play();if(p)p.catch(()=>{});}catch(e){}
    setTimeout(()=>{if(ctx.state!=="running")toast("Le son est bloqué. Sur iPhone, désactive le mode silencieux et monte le volume.");},900);}
  return ctx;}

/* --- J. écran allumé pendant le jeu --- */
let WL=null;setInterval(async()=>{const on=!!Eng.run||!!TP;try{if(on&&!WL&&navigator.wakeLock&&document.visibilityState==="visible"){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null;});}else if(!on&&WL){const w=WL;WL=null;await w.release();}}catch(e){}},1500);

/* --- K. actions --- */
let TAPS=[];
(function(){
  const _mix=ACT.mix;ACT.mix=(v,el)=>{_mix(v,el);if(v==="guitar"&&S&&S.mix.guitar&&Eng.run)S.guitarRun=false;};
  const _xsave=ACT.xsave;ACT.xsave=()=>{const pair=X.pair.slice(),n=X.count;_xsave();if(n>=MASTER){const nw=pair.filter(c=>!P.chords[c]);pair.forEach(c=>{P.chords[c]=true;});save();if(nw.length)setTimeout(()=>toast("Validé : "+nw.join(" et ")+" ("+n+" changements en une minute)"),600);}afterExercices();};
  ["xpair","rpat"].forEach(k=>{const f=ACT[k];ACT[k]=(v,el)=>{f(v,el);afterExercices();};});
  Object.assign(ACT,{
    learn:v=>{if(P.chords[v]){delete P.chords[v];save();render();return;}
      if(bestFor(v)>=MASTER){P.chords[v]=true;save();render();toast(v+" validé");return;}
      const p=partnerFor(v);go("exercices");X.pair=[v,p];X.phase="idle";view.focus="change";renderExercices();afterExercices();toast("Pour valider "+v+" : "+MASTER+" changements en une minute avec "+p+".");},
    lefty:()=>{P.lefty=!P.lefty;save();render();},
    tap:()=>{const now=performance.now();TAPS=TAPS.filter(t=>now-t<3000);TAPS.push(now);
      if(TAPS.length>=4){const iv=(TAPS[TAPS.length-1]-TAPS[0])/(TAPS.length-1),bpm=60000/iv,r=Math.max(.4,Math.min(1.2,bpm/S.song.bpm));S.rate=Math.round(r*20)/20;S.minRate=Math.min(S.minRate,S.rate);const el=$("#rate");if(el)el.value=S.rate*100;paintRate();toast("Tempo calé sur "+Math.round(bpm)+" BPM");}
      else toast("Continue : encore "+(4-TAPS.length)+" fois");},
    tabopen:v=>{go("exercices",{tabl:v});},
    tabback:()=>{go("exercices",{focus:"tabs"});},
    tabplay:()=>tabPlay(),
    tabmel:(v,el)=>{TS.mel=!TS.mel;el.setAttribute("aria-pressed",TS.mel);},
    coach:async()=>{const qEl=$("#coachQ"),out=$("#coachOut"),stop=$("#coachStop");if(!COACH||!qEl)return;const q=qEl.value.trim();if(!q){toast("Écris ta question d'abord.");return;}
      if(coachCtl)coachCtl.abort();const ctlr=new AbortController();coachCtl=ctlr;out.hidden=false;out.textContent="Le coach réfléchit…";stop.hidden=false;
      const prompt="Tu es un professeur de guitare bienveillant et très concret. Réponds en français, en 180 mots au maximum, en texte simple sans markdown ni tirets cadratins. Utilise exactement ces trois titres, chacun sur sa propre ligne : « Ce qui se passe probablement », « À essayer maintenant (5 minutes) », « Comment savoir que c'est réglé ». Si la question ne concerne pas la guitare, dis-le en une phrase. Si une douleur vive ou persistante est décrite, conseille d'arrêter et de consulter.\n\nContexte : "+coachContext()+"\n\nQuestion de l'élève : "+q;
      try{await COACH(prompt,{signal:ctlr.signal,cache:false,onText:({text})=>{out.textContent=text;}});}
      catch(e){const c=e&&e.code;if(c==="cancelled"){out.textContent=e.text||"";if(!e.text)out.hidden=true;}
        else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c))out.textContent="Le coach n'est pas disponible ici.";
        else if(c==="rate_limited")out.textContent=(e.text?e.text+"\n\n":"")+"Trop de questions d'un coup : réessaie dans un moment.";
        else if(c==="refused")out.textContent="Le coach ne peut pas répondre à cette question. Reformule-la autour de ta pratique.";
        else out.textContent=(e&&e.text?e.text+"\n\n":"")+"La réponse a été interrompue. Tu peux reposer la question.";}
      if(coachCtl===ctlr){stop.hidden=true;coachCtl=null;}},
    coachstop:()=>{if(coachCtl)coachCtl.abort();}
  });
})();
initCloud();initCoach();
render();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
